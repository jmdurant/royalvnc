name: CI

on:
  pull_request:
  push: # trigger on commits to the main branch
    branches:
      - main
    paths-ignore:
      - '.github/workflows/x-*.yml'
  workflow_dispatch: # and manually-triggered runs

permissions:
  # only allowed to read source code (ref. https://docs.github.com/en/actions/using-jobs/assigning-permissions-to-jobs)
  contents: read

concurrency:
  # cancel pending runs when a PR gets updated
  group: "${{ github.head_ref || github.run_id }}-${{ github.actor }}"
  cancel-in-progress: true

jobs:
  build:
    name: "CI - ${{ matrix.name }}"

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu ARM64"
            os: ubuntu-24-arm64-gh
            env:
              OS: "linux"
              NUGET_RID: "linux-arm64"

          - name: "Ubuntu x64"
            os: ubuntu-latest
            env:
              OS: "linux"
              NUGET_RID: "linux-x64"

          - name: "macOS ARM64"
            os: macos-latest
            env:
              OS: "apple"
              NUGET_RID: "osx"

          - name: "Windows x64"
            os: windows-latest
            env:
              OS: "windows"
              NUGET_RID: "win-x64"
              NUGET_PACK_DOTNET_LIB: "1"
              BUILD_TOOLS_ARCH: "amd64"

          - name: "Windows ARM64"
            os: windows-11-arm
            env:
              OS: "windows"
              NUGET_RID: "win-arm64"
              BUILD_TOOLS_ARCH: "arm64"

    runs-on: "${{ matrix.os }}"

    defaults:
      run:
        shell: "${{ matrix.env.OS == 'windows' && 'pwsh' || 'bash' }}"

    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      VCPKG_DISABLE_METRICS: 1
      NUGET_BASE_VERSION: "0.0"
      ROYALVNC_BUILD_DEBUG: 0
      SWIFT_VERSION: "6.2.4"

    steps:
    - name: checkout
      uses: actions/checkout@v6

    # setup build environment

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: setup environment (Apple)
      if: "success() && matrix.env.OS == 'apple'"
      run: |
        sudo xcode-select --switch /Applications/Xcode_26.2.app
        swift --version

    - name: setup VC++ environment (Windows)
      if: "success() && matrix.env.OS == 'windows'"
      uses: compnerd/gha-setup-vsdevenv@v6
      with:
        arch: "${{ matrix.env.BUILD_TOOLS_ARCH }}"
        host_arch: "${{ matrix.env.BUILD_TOOLS_ARCH }}"

    - name: setup Swift (Windows)
      if: "success() && matrix.env.OS == 'windows'"
      uses: compnerd/gha-setup-swift@v0.3.0
      with:
        branch: "swift-${{ env.SWIFT_VERSION }}-release"
        tag: "${{ env.SWIFT_VERSION }}-RELEASE"
        build_arch: "${{ matrix.env.BUILD_TOOLS_ARCH }}"

    # build RoyalVNCKit

    - name: build RoyalVNCKit (Apple)
      if: "success() && matrix.env.OS == 'apple'"
      run: |
        swift package clean

        swift build --configuration release --arch arm64
        swift build --configuration release --arch x86_64

        mkdir -p .build/universal-apple-macosx/release

        lipo -create \
          .build/arm64-apple-macosx/release/libRoyalVNCKit.dylib \
          .build/x86_64-apple-macosx/release/libRoyalVNCKit.dylib \
          -output .build/universal-apple-macosx/release/libRoyalVNCKit.dylib

    - name: build RoyalVNCKit
      if: "success() && matrix.env.OS != 'apple'"
      run: |
        swift package clean
        swift build --configuration release

    - name: run Swift regression tests
      run: swift test --configuration debug

    # .NET bindings and NuGet package artifacts

    - name: build .NET bindings
      run: |
        dotnet build --configuration Release Bindings/dotnet/RoyalApps.RoyalVNCKit.slnx

    - name: create native NuGet package
      if: "success() && matrix.env.NUGET_RID != ''"
      env:
        NUGET_VERSION: "${{ env.NUGET_BASE_VERSION }}.${{ github.run_number }}"
        NUGET_RID: "${{ matrix.env.NUGET_RID }}"
        NUGET_GIT_COMMIT: "${{ github.sha }}"
        NUGET_SWIFT_RT_VERSION: "${{ env.SWIFT_VERSION }}"
      run: |
        pwsh Bindings/dotnet/nuget-pack-native.ps1

    - name: test AOT build and interop (non-Windows)
      if: "success() && matrix.env.NUGET_RID != '' && matrix.env.OS != 'windows'"
      env:
        NUGET_VERSION: "${{ env.NUGET_BASE_VERSION }}.${{ github.run_number }}"
        NUGET_RID: "${{ matrix.env.NUGET_RID }}"
      run: |
        pwsh Bindings/dotnet/nuget-test-aot.ps1

    - name: create NuGet package
      if: "success() && matrix.env.NUGET_PACK_DOTNET_LIB == '1'"
      env:
        NUGET_VERSION: "${{ env.NUGET_BASE_VERSION }}.${{ github.run_number }}"
        NUGET_GIT_COMMIT: "${{ github.sha }}"
      run: |
        pwsh Bindings/dotnet/nuget-pack-dotnet.ps1

    - name: publish native NuGet packages
      if: "success() && matrix.env.NUGET_RID != ''"
      uses: actions/upload-artifact@v6
      with:
        name: "RoyalApps.RoyalVNCKit.native.${{ matrix.env.NUGET_RID }}"
        retention-days: 5
        if-no-files-found: "error"
        path: |
          Bindings/dotnet/RoyalApps.RoyalVNCKit.native/bin/Release/RoyalApps.*.nupkg

    - name: publish NuGet package
      if: "success() && matrix.env.NUGET_PACK_DOTNET_LIB == '1'"
      uses: actions/upload-artifact@v6
      with:
        name: "RoyalApps.RoyalVNCKit"
        retention-days: 5
        if-no-files-found: "error"
        path: |
          Bindings/dotnet/RoyalApps.RoyalVNCKit/bin/Release/RoyalApps.RoyalVNCKit.*.nupkg
    
    # Kotlin bindings and Android AAR artifacts

    - name: setup Java for Android
      if: "success() && matrix.env.OS == 'apple'"
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'

    - name: install Android dependencies
      if: "success() && matrix.env.OS == 'apple'"
      run: |
        ./android_dependencies.sh

    - name: build Android libraries
      if: "success() && matrix.env.OS == 'apple'"
      run: |
        ./android_build.sh

    - name: build and test Android application
      if: "success() && matrix.env.OS == 'apple'"
      working-directory: Bindings/kotlin/RoyalVNCAndroidTest
      run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

    - name: verify Android application package
      if: "success() && matrix.env.OS == 'apple'"
      run: python3 scripts/android-package-smoke.py

    - name: publish Android artifacts
      if: "success() && matrix.env.OS == 'apple'"
      uses: actions/upload-artifact@v6
      with:
        name: "royalvnc-android-arm64"
        retention-days: 5
        if-no-files-found: "error"
        path: |
          Bindings/kotlin/RoyalVNCAndroidTest/royalvnc/build/distributions/royalvnc.zip
          Bindings/kotlin/RoyalVNCAndroidTest/swiftRuntime/build/distributions/swiftRuntime_android.zip
          Bindings/kotlin/RoyalVNCAndroidTest/app/build/outputs/apk/debug/*.apk
          Bindings/kotlin/RoyalVNCAndroidTest/app/build/reports/tests/testDebugUnitTest/

  apple-apps:
    name: "Apple app - ${{ matrix.platform }}"
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            runtime: iOS
          - platform: tvos
            runtime: tvOS
          - platform: watchos
            runtime: watchOS
    steps:
      - uses: actions/checkout@v6
      - name: install project generator
        run: brew list xcodegen || brew install xcodegen
      - name: prepare simulator runtime
        run: xcodebuild -downloadPlatform "${{ matrix.runtime }}"
      - name: build, verify package, and launch
        run: python3 scripts/apple-app-smoke.py "${{ matrix.platform }}"
      - name: publish app smoke evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: apple-smoke-${{ matrix.platform }}
          retention-days: 5
          if-no-files-found: warn
          path: |
            .build/apple-smoke/${{ matrix.platform }}/build.log
            .build/apple-smoke/${{ matrix.platform }}/launch.png
            .build/apple-smoke/${{ matrix.platform }}/RoyalVNC-simulator.zip

  android-credentials:
    name: Android Keystore instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Hosted arm64 macOS runners cannot virtualize an Android emulator.
      # Run Keystore tests on x86_64 here; NativeLibrarySmokeTest requires
      # the arm64 native APK and a local arm64 emulator or physical device.
      - name: run real Android Keystore tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          working-directory: Bindings/kotlin/RoyalVNCAndroidTest
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.royalvncandroidtest.CredentialStoreTest
      - name: publish Android instrumentation results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-credential-instrumentation
          retention-days: 5
          if-no-files-found: warn
          path: |
            Bindings/kotlin/RoyalVNCAndroidTest/app/build/reports/androidTests/
            Bindings/kotlin/RoyalVNCAndroidTest/app/build/outputs/androidTest-results/
