name: RoyalVNCiOS
options:
  bundleIdPrefix: com.royalapps.royalvnc
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  preGenCommand: python3 ../scripts/apple-version.py

configFiles:
  Debug: ../.build/apple-version.xcconfig
  Release: ../.build/apple-version.xcconfig

packages:
  RoyalVNCKit:
    path: ..

targets:
  RoyalVNCiOS:
    type: application
    platform: iOS
    sources:
      - path: ../Sources/RoyalVNCKitiOSDemo
    dependencies:
      - package: RoyalVNCKit
        product: RoyalVNCClientCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.royalapps.royalvnc.ios
        PRODUCT_NAME: RoyalVNC
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
