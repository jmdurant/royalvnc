name: RoyalVNCWatch
options:
  bundleIdPrefix: com.royalapps.royalvnc
  deploymentTarget:
    watchOS: "10.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  preGenCommand: python3 ../scripts/apple-version.py

configFiles:
  Debug: ../.build/apple-version.xcconfig
  Release: ../.build/apple-version.xcconfig

packages:
  RoyalVNCKit:
    path: ..

targets:
  RoyalVNCWatch:
    type: application
    platform: watchOS
    sources:
      - path: ../Sources/RoyalVNCKitWatchDemo
    dependencies:
      - package: RoyalVNCKit
        product: RoyalVNCClientCore
    info:
      path: ../.build/WatchApp-Info.plist
      properties:
        CFBundleDisplayName: RoyalVNC
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: true
        NSLocalNetworkUsageDescription: "RoyalVNC uses the local network to discover VNC servers nearby."
        NSBonjourServices:
          - "_rfb._tcp"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.royalapps.royalvnc.watch
        PRODUCT_NAME: RoyalVNC
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
