name: RoyalVNCTV
options:
  bundleIdPrefix: com.royalapps.royalvnc
  deploymentTarget:
    tvOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  preGenCommand: python3 ../scripts/apple-version.py

configFiles:
  Debug: ../.build/apple-version.xcconfig
  Release: ../.build/apple-version.xcconfig

packages:
  RoyalVNCKit:
    path: ..

targets:
  RoyalVNCTV:
    type: application
    platform: tvOS
    sources:
      - path: ../Sources/RoyalVNCKitTVDemo
    dependencies:
      - package: RoyalVNCKit
        product: RoyalVNCClientCore
    info:
      path: ../.build/TVApp-Info.plist
      properties:
        CFBundleDisplayName: RoyalVNC
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: "RoyalVNC uses the local network to discover VNC servers nearby."
        NSBonjourServices:
          - "_rfb._tcp"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.royalapps.royalvnc.tv
        PRODUCT_NAME: RoyalVNC
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
